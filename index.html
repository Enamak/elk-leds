<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111">
<title>LEDs Fibra</title>
<style>
  :root { --bg:#111; --card:#1c1c1f; --fg:#eee; --muted:#888; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; padding:16px; max-width:520px; margin-inline:auto; }
  h1 { font-size:1.2rem; margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; }
  #status { font-size:.8rem; color:var(--muted); font-weight:normal; }
  #status.ok { color:#4cd964; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:.85rem; color:var(--muted); margin:0 0 10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  button { font:inherit; border:0; border-radius:10px; padding:12px; background:#2a2a2e; color:var(--fg); cursor:pointer; }
  button:active { transform:scale(.97); }
  .row { display:grid; gap:8px; grid-template-columns:1fr 1fr; }
  #connect { width:100%; background:var(--accent); font-weight:600; margin-bottom:12px; }
  .on { background:#2e7d32; } .off { background:#8e2424; }
  .swatches { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .swatches button { aspect-ratio:1; border-radius:50%; padding:0; border:2px solid #0006; }
  input[type=color] { width:100%; height:48px; border:0; border-radius:10px; background:none; margin-top:10px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  label { display:flex; justify-content:space-between; font-size:.9rem; margin:6px 0 2px; }
  select { width:100%; font:inherit; padding:10px; border-radius:10px; background:#2a2a2e; color:var(--fg); border:0; }
  #log { font-family:monospace; font-size:.7rem; color:var(--muted); white-space:pre-wrap; max-height:90px; overflow:auto; }
  .disabled { opacity:.4; pointer-events:none; }
</style>
</head>
<body>
<h1>LEDs Fibra <span id="status">desligado</span></h1>
<button id="connect">Ligar ao controlador</button>

<div id="controls" class="disabled">
  <div class="card">
    <div class="row">
      <button class="on" data-cmd="7E0004F00001FF00EF">ON</button>
      <button class="off" data-cmd="7E0004000000FF00EF">OFF</button>
    </div>
  </div>

  <div class="card">
    <h2>Cor</h2>
    <div class="swatches" id="swatches"></div>
    <input type="color" id="picker" value="#ff8000">
  </div>

  <div class="card">
    <h2>Brilho e velocidade</h2>
    <label>Brilho <span id="bVal">100</span></label>
    <input type="range" id="bright" min="0" max="100" value="100">
    <label>Velocidade dos efeitos <span id="sVal">50</span></label>
    <input type="range" id="speed" min="0" max="100" value="50">
  </div>

  <div class="card">
    <h2>Efeitos</h2>
    <select id="effect">
      <option value="">— escolher —</option>
      <option value="87">Saltar: vermelho / verde / azul</option>
      <option value="88">Saltar: 7 cores</option>
      <option value="89">Fade: vermelho / verde / azul</option>
      <option value="8A">Fade: 7 cores</option>
      <option value="8B">Fade: vermelho</option>
      <option value="8C">Fade: verde</option>
      <option value="8D">Fade: azul</option>
      <option value="8E">Fade: amarelo</option>
      <option value="8F">Fade: ciano</option>
      <option value="90">Fade: magenta</option>
      <option value="91">Fade: branco</option>
      <option value="92">Fade: vermelho / verde</option>
      <option value="93">Fade: vermelho / azul</option>
      <option value="94">Fade: verde / azul</option>
      <option value="95">Piscar: 7 cores</option>
      <option value="96">Piscar: vermelho</option>
      <option value="97">Piscar: verde</option>
      <option value="98">Piscar: azul</option>
      <option value="99">Piscar: amarelo</option>
      <option value="9A">Piscar: ciano</option>
      <option value="9B">Piscar: magenta</option>
      <option value="9C">Piscar: branco</option>
    </select>
  </div>

  <div class="card">
    <h2>Log</h2>
    <div id="log"></div>
  </div>
</div>

<script>
// Protocolo ELK-BLEDOM: 9 bytes, 7E ... EF
const SERVICES = [
  { service: 0xfff0, char: 0xfff3 },
  { service: 0xffe0, char: 0xffe1 },
];
const COLORS = ['#ff0000','#ff4000','#ff8000','#ffff00','#00ff00','#00ffff','#0000ff','#8000ff','#ff00ff','#ff0060','#ffffff','#ffb060'];

const $ = id => document.getElementById(id);
let device, characteristic;
let queue = Promise.resolve();

function log(msg) {
  const el = $('log');
  el.textContent = msg + '\n' + el.textContent.slice(0, 2000);
}

function hex(n) { return Math.max(0, Math.min(255, n|0)).toString(16).padStart(2, '0').toUpperCase(); }

// Serialise writes: BLE rejects a write while another is in flight
function send(hexStr) {
  if (!characteristic) return;
  const bytes = new Uint8Array(hexStr.match(/../g).map(b => parseInt(b, 16)));
  queue = queue.then(() => {
    log('→ ' + hexStr);
    return characteristic.writeValueWithoutResponse
      ? characteristic.writeValueWithoutResponse(bytes)
      : characteristic.writeValue(bytes);
  }).catch(e => log('erro: ' + e.message));
}

// Sliders and the colour picker fire dozens of events per second; only send the latest
function throttled(fn, ms = 80) {
  let timer, lastArgs;
  return (...args) => {
    lastArgs = args;
    if (!timer) timer = setTimeout(() => { timer = null; fn(...lastArgs); }, ms);
  };
}

const setColor = throttled(c => {
  const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
  send(`7E000503${hex(r)}${hex(g)}${hex(b)}00EF`);
});
const setBright = throttled(v => send(`7E0001${hex(v)}00000000EF`));
const setSpeed = throttled(v => send(`7E0002${hex(v)}00000000EF`));

async function connect() {
  if (!navigator.bluetooth) {
    alert('Este browser não suporta Web Bluetooth. Usa o Chrome no Android.');
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'ELK' }],
      optionalServices: SERVICES.map(s => s.service),
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    $('status').textContent = 'a ligar…';
    const server = await device.gatt.connect();
    for (const s of SERVICES) {
      try {
        const svc = await server.getPrimaryService(s.service);
        characteristic = await svc.getCharacteristic(s.char);
        log(`ligado via ${s.service.toString(16)}/${s.char.toString(16)}`);
        break;
      } catch { /* try next */ }
    }
    if (!characteristic) throw new Error('characteristic FFF3/FFE1 não encontrada');
    $('status').textContent = device.name;
    $('status').className = 'ok';
    $('connect').textContent = 'Desligar do controlador';
    $('controls').classList.remove('disabled');
  } catch (e) {
    log('erro: ' + e.message);
    $('status').textContent = 'falhou';
  }
}

function onDisconnect() {
  characteristic = null;
  $('status').textContent = 'desligado';
  $('status').className = '';
  $('connect').textContent = 'Ligar ao controlador';
  $('controls').classList.add('disabled');
  log('desligado');
}

$('connect').onclick = () => device?.gatt.connected ? device.gatt.disconnect() : connect();
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => send(b.dataset.cmd));

COLORS.forEach(c => {
  const b = document.createElement('button');
  b.style.background = c;
  b.onclick = () => { $('picker').value = c; setColor(c); };
  $('swatches').appendChild(b);
});
$('picker').oninput = e => setColor(e.target.value);
$('bright').oninput = e => { $('bVal').textContent = e.target.value; setBright(+e.target.value); };
$('speed').oninput = e => { $('sVal').textContent = e.target.value; setSpeed(+e.target.value); };
$('effect').onchange = e => { if (e.target.value) send(`7E0003${e.target.value}03000000EF`); };
</script>
</body>
</html>
